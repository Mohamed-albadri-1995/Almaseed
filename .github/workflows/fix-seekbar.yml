name: Fix Android RTL seek bar

on:
  push:
    branches: ['claude/new-session-qj5aro']
    paths:
      - '.github/workflows/fix-seekbar.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix RTL seek direction
        shell: python
        run: |
          from pathlib import Path
          p = Path('mobile/App.js')
          s = p.read_text(encoding='utf-8')

          old = "const fractionFromEvent = (e) => clamp((e.nativeEvent.locationX || 0) / wRef.current);"
          new = "const fractionFromEvent = (e) => clamp(1 - ((e.nativeEvent.locationX || 0) / wRef.current));"
          if old not in s:
              raise SystemExit('fractionFromEvent pattern not found')
          s = s.replace(old, new, 1)

          old = '<View style={styles.seekTrack}><View style={[styles.seekFill, { width: `${frac * 100}%` }]} /><View style={[styles.seekThumb, { left: `${frac * 100}%` }]} /></View>'
          new = '<View style={styles.seekTrack}><View style={[styles.seekFill, { width: `${frac * 100}%` }]} /><View style={[styles.seekThumb, { right: `${frac * 100}%` }]} /></View>'
          if old not in s:
              raise SystemExit('seek JSX pattern not found')
          s = s.replace(old, new, 1)

          old = "seekWrap: { width: '100%', alignSelf: 'stretch', marginTop: 10, direction: 'ltr' }"
          new = "seekWrap: { width: '100%', alignSelf: 'stretch', marginTop: 10, direction: 'rtl' }"
          if old not in s:
              raise SystemExit('seekWrap pattern not found')
          s = s.replace(old, new, 1)

          old = "seekFill: { position: 'absolute', left: 0, height: 8, borderRadius: 4, backgroundColor: C.gold }"
          new = "seekFill: { position: 'absolute', right: 0, height: 8, borderRadius: 4, backgroundColor: C.gold }"
          if old not in s:
              raise SystemExit('seekFill pattern not found')
          s = s.replace(old, new, 1)

          old = "seekThumb: { position: 'absolute', width: 20, height: 20, borderRadius: 10, backgroundColor: C.gold, marginLeft: -10, top: -6, borderWidth: 2, borderColor: '#12241d' }"
          new = "seekThumb: { position: 'absolute', width: 20, height: 20, borderRadius: 10, backgroundColor: C.gold, marginRight: -10, top: -6, borderWidth: 2, borderColor: '#12241d' }"
          if old not in s:
              raise SystemExit('seekThumb pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.js
          git commit -m "Fix Android RTL audio seek bar direction"
          git push

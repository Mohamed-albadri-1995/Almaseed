name: Build Android APK

# Builds the أرشيف المسيد mobile app into an installable APK on GitHub's
# servers and uploads it as a downloadable artifact. No local setup needed.
on:
  workflow_dispatch: {} # manual "Run workflow" button
  push:
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint || ./gradlew assembleDebug -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

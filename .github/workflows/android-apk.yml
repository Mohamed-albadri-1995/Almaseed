name: Build Android APK

# Legacy debug-APK builder. Superseded by EAS builds (Expo cloud) for SDK 54+.
# Manual-only now, so it no longer auto-fails on every mobile push. It may need
# updating before it works again on SDK 54.
on:
  workflow_dispatch: {} # manual "Run workflow" button only

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Ensure splash color resource exists
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          mkdir -p android/app/src/main/res/values
          if [ ! -f "$COLORS" ]; then
            printf '%s\n' '<resources>' '    <color name="splashscreen_background">#1f3d33</color>' '</resources>' > "$COLORS"
          elif ! grep -q splashscreen_background "$COLORS"; then
            sed -i 's@</resources>@    <color name="splashscreen_background">#1f3d33</color>\n</resources>@' "$COLORS"
          fi
          echo "----- colors.xml -----"; cat "$COLORS"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint || ./gradlew assembleDebug -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

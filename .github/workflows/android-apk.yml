name: Build Android APK

# Builds an installable APK and an AAB on GitHub's runners and uploads both as
# downloadable artifacts. Manual only (Run workflow button). The AAB here is
# debug-signed, so it is fine for testing but NOT valid to upload to Google Play
# — the Play build must be produced and signed by EAS.
on:
  workflow_dispatch: {} # manual "Run workflow" button only

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Ensure splash color resource exists
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          mkdir -p android/app/src/main/res/values
          if [ ! -f "$COLORS" ]; then
            printf '%s\n' '<resources>' '    <color name="splashscreen_background">#1f3d33</color>' '</resources>' > "$COLORS"
          elif ! grep -q splashscreen_background "$COLORS"; then
            sed -i 's@</resources>@    <color name="splashscreen_background">#1f3d33</color>\n</resources>@' "$COLORS"
          fi
          echo "----- colors.xml -----"; cat "$COLORS"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint || ./gradlew assembleDebug -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Build release AAB (debug-signed — testing only)
        run: |
          cd android
          ./gradlew bundleRelease -x lint || true
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-aab
          path: mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

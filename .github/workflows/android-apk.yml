name: Build Android APK

# Builds an installable (debug-signed) APK for direct testing, and — when the
# upload-keystore secrets are configured — a Play-valid, upload-key-signed AAB.
# Both are uploaded as downloadable artifacts. Manual only (Run workflow button).
#
# To get the signed AAB, add these repository secrets (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your EAS upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
on:
  workflow_dispatch: {} # manual "Run workflow" button only

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Ensure splash color resource exists
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          mkdir -p android/app/src/main/res/values
          if [ ! -f "$COLORS" ]; then
            printf '%s\n' '<resources>' '    <color name="splashscreen_background">#1f3d33</color>' '</resources>' > "$COLORS"
          elif ! grep -q splashscreen_background "$COLORS"; then
            sed -i 's@</resources>@    <color name="splashscreen_background">#1f3d33</color>\n</resources>@' "$COLORS"
          fi
          echo "----- colors.xml -----"; cat "$COLORS"

      - name: Configure upload signing (if secrets present)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload.jks
            {
              echo "ALMASEED_UPLOAD_STORE_FILE=upload.jks"
              echo "ALMASEED_UPLOAD_KEY_ALIAS=$KS_ALIAS"
              echo "ALMASEED_UPLOAD_STORE_PASSWORD=$KS_PASS"
              echo "ALMASEED_UPLOAD_KEY_PASSWORD=$KEY_PASS"
            } >> android/gradle.properties
            cat ci-release-signing.gradle >> android/app/build.gradle
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Upload keystore configured; a signed AAB will be built."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping the signed AAB."
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint || ./gradlew assembleDebug -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Build signed AAB (Play)
        if: env.SIGNED == '1'
        run: |
          cd android
          ./gradlew bundleRelease -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: env.SIGNED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: almaseed-aab
          path: mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

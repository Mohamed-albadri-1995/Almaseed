name: Check

# Runs on every push: type-check + production build of the website, and a
# syntax check of the app's JavaScript. Railway's «Wait for CI» setting holds
# each deploy until this passes, so a broken commit never reaches almaseeed.com.
on:
  push: {}
  pull_request: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: App syntax check
        run: node scripts/check-mobile-syntax.mjs

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
